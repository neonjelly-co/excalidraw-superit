services:
  excalidraw:
    build:
      context: .
      args:
        - NODE_ENV=production
    container_name: excalidraw
    ports:
      - "3000:80"
    restart: on-failure
    environment:
      APP_BACKEND_V2_GET_URL: https://json.excalidraw.com/api/v2/
      APP_BACKEND_V2_POST_URL: https://json.excalidraw.com/api/v2/post/
      APP_WS_SERVER_URL: https://oss-collab.excalidraw.com
      APP_AI_BACKEND: https://oss-ai.excalidraw.com
